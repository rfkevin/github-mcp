name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Déterminer si le code a changé
        id: changes
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changes.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true' || (github.event_name == 'push' && vars.RELEASE_PIPELINE_ENABLED == 'true')
        with:
          node-version: '24.19.0'
          cache: npm
          package-manager-cache: false
      - name: Installer une seule fois
        if: steps.changes.outputs.run == 'true' || (github.event_name == 'push' && vars.RELEASE_PIPELINE_ENABLED == 'true')
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Types, tests et compilation sans déploiement
        if: steps.changes.outputs.run == 'true' || (github.event_name == 'push' && vars.RELEASE_PIPELINE_ENABLED == 'true')
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:full
      # Le job existe aussi pour une PR documentaire : pas de contrôle requis bloqué en Pending.
      - name: Bilan documentaire
        if: steps.changes.outputs.run == 'false' && !(github.event_name == 'push' && vars.RELEASE_PIPELINE_ENABLED == 'true')
        run: echo 'Documentation seule ; aucune exécution de code nécessaire.'
      - name: Sceller le paquet testé, sans secrets de déploiement
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.RELEASE_PIPELINE_ENABLED == 'true'
        run: node scripts/deploy/release.mjs seal
      - name: Conserver le paquet immuable
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.RELEASE_PIPELINE_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-release
          path: |
            .release/manifest.json
            .release/worker/
          if-no-files-found: error
          retention-days: 14
