name: agent-checks
run-name: agent-checks/${{ inputs.target_sha }}/${{ inputs.scope }}/${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Contrôle choisi (aucun déploiement)
        type: choice
        options: [quick, typecheck, unit, full]
        default: quick
        required: true
      target_sha:
        description: SHA complet du commit à tester dans ce dépôt
        type: string
        required: true
      target:
        description: Fichier test/*.spec.ts, uniquement pour unit ; vide = tous
        type: string
        default: ''
      request_id:
        description: Identifiant de corrélation, lettres/chiffres/tirets
        type: string
        default: manual

permissions:
  contents: read

concurrency:
  group: agent-checks-${{ inputs.target_sha }}-${{ inputs.scope }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  checks:
    # Le contrôleur provient exclusivement de la branche par défaut, pas du commit testé.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHECK_SCOPE: ${{ inputs.scope }}
      CHECK_TARGET: ${{ inputs.target }}
      CHECK_SHA: ${{ inputs.target_sha }}
      CHECK_REQUEST_ID: ${{ inputs.request_id }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Charger le contrôleur de confiance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Valider les paramètres avant de charger la cible
        run: node control/scripts/ci/validate-inputs.mjs
      - name: Charger le commit cible sans identifiants persistants
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          path: target
          persist-credentials: false
          submodules: false
      - name: Vérifier le commit réellement chargé
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "${CHECK_SHA,,}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: target/package-lock.json
          package-manager-cache: false
      - name: Installer une seule fois sans scripts de cycle de vie
        working-directory: target
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Exécuter le plan de confiance sur la cible
        working-directory: target
        run: node ../control/scripts/ci/run-checks.mjs
      # Aucun secret, environnement de déploiement, pull_request_target ou jeton d'écriture.
      # Le head_sha GitHub est celui du contrôleur. target_sha est dans le run-name.
